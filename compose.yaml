name: ${COMPOSE_PROJECT_NAME:-atlazddesk}

x-app: &app
  image: atlazddesk-app:${RELEASE:-1.0.0}
  build:
    context: .
    target: app
  env_file:
    - path: ./installation/app.env
      required: false
  init: true
  restart: unless-stopped
  volumes:
    - private_uploads:/var/www/html/storage/app/private
    - app_logs:/var/www/html/storage/logs
  networks: [backend, outbound]
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  stop_grace_period: 90s
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  app:
    <<: *app
    healthcheck:
      test: [CMD, php, /opt/atlazddesk/health.php, app]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: [php, artisan, 'queue:work', redis, '--queue=notifications,maintenance,default', '--sleep=3', '--tries=3', '--timeout=60']
    healthcheck:
      test: [CMD, php, /opt/atlazddesk/health.php, worker]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    command: [php, artisan, 'schedule:work', '--no-interaction']
    healthcheck:
      test: [CMD, php, /opt/atlazddesk/health.php, scheduler]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    image: atlazddesk-web:${RELEASE:-1.0.0}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      NGINX_ENVSUBST_FILTER: '^(PUBLIC_HOST|APP_ORIGIN)$'
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - type: bind
        source: ./installation/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    networks: [frontend, backend]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging

  database:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - path: ./installation/database.env
        required: false
    volumes:
      - database_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: [CMD, healthcheck.sh, '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - path: ./installation/redis.env
        required: false
    command:
      - sh
      - -ec
      - 'test -n "$$REDIS_PASSWORD"; exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  setup:
    image: atlazddesk-app:${RELEASE:-1.0.0}
    build:
      context: .
      target: app
    profiles: [tools]
    user: '0:0'
    entrypoint: [php, /opt/atlazddesk/configure.php]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
    volumes:
      - ./installation:/output
    network_mode: none

networks:
  frontend:
  outbound:
  backend:
    internal: true

volumes:
  database_data:
  redis_data:
  private_uploads:
  app_logs:
