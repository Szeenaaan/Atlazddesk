# Replace support.example.com and /var/www/amc-platform with your actual deployment.
# Obtain a working TLS certificate before enabling this host.
server {
    listen 80;
    server_name support.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name support.example.com;
    ssl_certificate /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;

    root /var/www/amc-platform/frontend/dist;
    index index.html;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        try_files /__amc_path_not_present__ @laravel;
    }
    location ^~ /sanctum/ {
        try_files /__amc_path_not_present__ @laravel;
    }
    location = /up {
        try_files /__amc_path_not_present__ @laravel;
    }
    location @laravel {
        rewrite ^ /index.php last;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/amc-platform/backend-overlay/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/amc-platform/backend-overlay/public;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 35s;
        fastcgi_send_timeout 35s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
