Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 8
ReadTimeout 10
CommandReadTimeout 10
SendBufTimeout 1000
StreamMaxLength 10M
MaxScanSize 40M
MaxFileSize 12M
MaxRecursion 8
MaxFiles 1000
MaxScanTime 8000
AlertExceedsMax yes
AlertEncrypted yes
FailIfCvdOlderThan 7
ConcurrentDatabaseReload no
