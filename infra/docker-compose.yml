services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: amc_platform
      MARIADB_USER: amc_platform_user
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes: [mariadb_data:/var/lib/mysql]
    ports: ['127.0.0.1:3307:3306']
    healthcheck:
      test: ['CMD','healthcheck.sh','--connect','--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server','--appendonly','yes','--requirepass','${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes: [redis_data:/data]
    ports: ['127.0.0.1:6380:6379']
    healthcheck:
      test: ['CMD-SHELL','redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
volumes:
  mariadb_data:
  redis_data:
